name: Check Production Vulnerabilities

on:
    workflow_dispatch:
    schedule:
        - cron: '48 11 * * 1,4'
          timezone: 'Europe/Brussels'

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.16.0'
                  cache: 'npm'
            - run: npm run ci:check-production-vulnerabilities
