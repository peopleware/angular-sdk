name: Build & Test

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.1'
                  cache: 'npm'
            - run: npm run ci:check-production-vulnerabilities
            - name: Cache node modules
              uses: actions/cache@v6
              with:
                path: node_modules
                key: node_modules-${{hashFiles('package-lock.json')}} # Cache based on package-lock.json
                restore-keys: node_modules- # Take any latest cache if failed to find it for current package-lock.json
            - run: npm install
            - run: npm run ci:lint
            - run: npm run ci:build-libs
            - run: npm run ci:test-libs
            - run: npx playwright install --with-deps chromium
            - run: npm run ci:test-e2e
